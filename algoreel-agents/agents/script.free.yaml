# DEPRECATED: superseded by ensureSpec.ts — see script.yaml's DEPRECATED
# note. This file was the actual source of the "1 success in 5" qwen3
# result that motivated the whole local-model migration (ensureSpec.ts's
# own comment cites it directly), which is why it's kept for one release
# rather than deleted outright — it's the negative result, not dead
# weight. Nothing still runs it.
#
# STATUS: free/local-only variant of script.yaml — same instructions,
# tools, and approvals (copied, not shared: AgentForge has no YAML
# include/inherit mechanism, so keep the two files' instructions/tools/
# approvals/limits blocks in sync by hand if either changes), only the
# model block differs. script.yaml (Anthropic's claude-sonnet-5) is the
# recommended default; use this file only if avoiding a paid API key
# matters more than the drawbacks below. Both real drawbacks were
# measured live in this project, not assumed:
#
# - Gemini (the active model here): needs AgentForge's native `gemini`
#   provider (internal/provider/gemini.go), not the generic openai
#   provider against Gemini's OpenAI-compat endpoint — that combination
#   breaks on the second turn of every tool-calling run, because
#   Gemini's thinking models attach an opaque thoughtSignature to
#   functionCall parts and 400 if a later turn replays one without it,
#   and the openai provider's wire structs have nowhere to carry it. Also
#   needs a tool-schema sanitizer, since Gemini's function declarations
#   reject standard JSON Schema keywords ($schema, additionalProperties,
#   propertyNames) that a real MCP tool schema emits. Both fixed already
#   (see that provider file), but they're dependencies this file carries
#   that script.yaml doesn't. On top of that, gemini-3.7-flash's free
#   tier is capped at 20 requests/day (a hard daily cap, confirmed by
#   polling every 15s for 5 minutes with no recovery) — gemini-flash-lite-
#   latest has a separate quota bucket, which is why it's the name below.
#
# - qwen3:8b via Ollama (commented out below, fully local, zero API key):
#   measurably cannot hold this agent's combination of open-ended
#   authoring and multi-round validate_spec self-correction. Across
#   repeated trials it skipped validate_spec entirely, looped
#   unproductively re-misplacing targetDurationSec until max_turns, or —
#   the dominant failure even after adding the run_algorithm step below —
#   silently gave no final answer at all right after its first or second
#   tool call. Best observed rate: 1 success in 5 direct-topic trials
#   (bfs, binary search, bubble sort x2, linked list), all using this
#   exact config. It's reliable for animate.yaml's more mechanical
#   workflow (see that file's comments) — just not for this one. See
#   README.md's Phase 3 section for the full writeup.
name: script-free

model:
  provider: gemini
  # gemini-3.7-flash's free tier is capped at 20 requests/day and this
  # project burned through it during testing — gemini-flash-lite-latest
  # (currently gemini-3.5-flash-lite) has a separate per-model quota
  # bucket that was still available. Swap back to a non-lite Flash if
  # authoring quality needs it and the daily quota has reset.
  name: gemini-flash-lite-latest
  api_key: ${GOOGLE_API_KEY}
  temperature: 0.3
  # Fully local, zero API key, but see the STATUS note above before
  # relying on this for script.yaml's job — animate.yaml is where qwen3
  # actually earns its keep:
  # provider: ollama
  # name: algoreel-llama

instructions: |
  HARD RULE, before anything else: you may NEVER give a final text answer
  in this conversation until a validate_spec tool call has returned
  valid: true. Not on your first turn, not "because you're confident it's
  already correct" — always call validate_spec on your draft and see
  valid: true with your own eyes first. A JSON document that merely
  matches the schema but skipped validate_spec is a failed attempt, even
  if every field looks right. This matters because validate_spec catches
  real mistakes a schema cannot see: it actually runs the algorithm, so it
  knows exactly how many animation steps exist and whether your narration
  or emphasis words match what really happens — you do not, until you ask it.

  You turn a topic into a complete StorySpec for a DSA explainer Short.
  You decide the story: which algorithm best fits the topic, a concrete
  input, the hook, the narration beats, which words get emphasis, and the
  YouTube metadata. You never invent what the algorithm actually does —
  validate_spec is the only source of truth for that.

  Required steps, in order:
  1. Call list_algorithms.
  2. If one of its entries genuinely matches the topic, pick it and a
     small, concrete input (5-8 numbers is plenty; binarySearch needs it
     sorted ascending; bfs needs nodes/edges/start).

     If nothing genuinely matches but the topic is really about
     *sorting* a list of numbers, call ensure_algorithm with
     {algorithm, structure: "array"} instead of forcing a mismatched
     existing algorithm into the slot. It makes sure a working
     implementation exists — writing and validating one behind the
     scenes if it doesn't yet — and can take a while the first time, but
     is near-instant on every later request for the same name. It does
     not run the algorithm on your chosen input; use the name it returns
     with run_algorithm({algorithm: <that name>, input}) for that.

     ensure_algorithm is sorting-only, not searching (its correctness
     check compares the result against the array sorted ascending, which
     has no meaning for a search) — binarySearch is the only searching
     algorithm available, from list_algorithms. Don't call
     ensure_algorithm for a search; treat it the same as a non-array
     topic below.

     If the topic isn't even array-shaped — a genuinely different data
     structure — check list_algorithms for a real match on that structure
     first. Three real ones exist now, rendered as actual connected
     nodes, never blocks: reverseLinkedList (a real linked list),
     inorderTraversal (a real binary tree), checkBalancedParens (a real
     stack). If it's graph traversal beyond hand-written bfs (most likely
     "dfs"), call ensure_algorithm with {algorithm: "dfs", structure:
     "graph"} — same codegen mechanism as above, bfs/dfs only, checked
     against a real reference traversal instead of "is it sorted." Don't
     call it for Dijkstra, MST, or anything needing edge weights. If
     nothing above genuinely matches, do not force-fit an existing
     algorithm. Name the spec after whatever you actually run, not the
     original request, if they don't match.
  3. Call run_algorithm({algorithm, input}) with the name you picked in
     step 2 (or the name ensure_algorithm returned), and read its
     summary and primaryStepCount. Base every "op:N" beat you write on
     what it actually reports, not on what you'd expect the algorithm to
     do — it is the only source of truth for the trace, and its
     primaryStepCount is a hard ceiling on how many "op:N" beats you may
     write (fewer is fine; never more).
  4. Draft a full StorySpec matching this exact top-level shape — copy this
     structure, don't nest fields anywhere other than shown here (a common
     mistake is nesting targetDurationSec inside youtube; it belongs at the
     top level, as a sibling of youtube, not inside it):
     {
       "version": 1,
       "topic": "...",
       "targetDurationSec": 30,
       "hook": "...",
       "narration": [{ "beat": "intro", "text": "..." }, ...],
       "emphasis": ["...", "..."],
       "complexity": { "time": "...", "space": "..." },
       "youtube": { "title": "...", "description": "...", "tags": ["..."] },
       "algorithm": "...",
       "input": { ... }
     }
     Two rules the schema itself cannot enforce:
     - "op:N" beats MUST start at op:0 and increase one at a time with no
       gaps: op:0, op:1, op:2, ... — never op:1, op:2 (missing op:0) and
       never op:0, op:2 (skipping op:1). Use at most run_algorithm's
       primaryStepCount; when in doubt, write fewer beats.
     - Every string in "emphasis" must appear character-for-character
       (case-insensitive) inside your narration text somewhere — prefer
       single words you're certain you used, over invented phrases.
  5. Call validate_spec on that draft — even a rough one, immediately,
     as your very next tool call after drafting it. Do not skip this.
  6. Read the errors. Fix every one, including ones a JSON Schema can't
     express: an unsorted array, more "op:N" beats than the algorithm has
     real animation steps (use at most the primaryStepCount run_algorithm
     and validate_spec name), an emphasis word that isn't literally in any
     narration text.
  7. Call validate_spec again on the fixed version. Repeat step 6-7 until
     it returns valid: true.
  8. Only then, give your final answer: the StorySpec JSON and nothing
     else — no prose, no markdown fences, no explanation.

mcp:
  - name: algoreel
    transport: stdio
    # ${ALGOREEL_MCP_DIR} keeps this config machine-independent — export it
    # to algoreel-mcp's path before running:
    #   export ALGOREEL_MCP_DIR=/path/to/AlgoReel/algoreel-mcp
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/server.ts"]

tools:
  - "algoreel.list_algorithms"
  - "algoreel.run_algorithm"
  - "algoreel.ensure_algorithm"
  - "algoreel.validate_spec"

approvals:
  mode: annotated
  auto_approve:
    ["algoreel.list_algorithms", "algoreel.run_algorithm", "algoreel.ensure_algorithm", "algoreel.validate_spec"]
  # list_algorithms and validate_spec are pure and side-effect-free.
  # run_algorithm does write a scratch operations-log JSON under
  # algoreel-mcp/out/ (src/server.ts) so the model can be given a
  # primaryStepCount without dumping the full trace into context, but
  # that file is disposable working data, not a published artifact like
  # animate.yaml's render_preview output — so auto-approving it here
  # doesn't skip anything a human would want to gate. ensure_algorithm's
  # rationale is the same as script.yaml's — see that file's comment.

# Deliberately NOT using AgentForge's output.schema feature here, even
# though it exists for exactly this job (auto-validate + auto-retry a
# final JSON answer against a schema — see algoreel-mcp/scripts/
# generate-story-spec-schema.ts, which still generates the schema file at
# ./schemas/story-spec.json). Measured directly against qwen3: with
# output.schema present, it reliably skipped calling validate_spec and
# jumped straight to a final answer every time (3 different instruction
# phrasings, always the same result) — almost certainly because
# AgentForge auto-appends "Your final response must be a single JSON
# document conforming exactly to the following JSON Schema"
# (internal/schema/extract.go) as the very last thing in the system
# prompt, after these instructions, and a small model weights that
# recency over an earlier "call validate_spec first" rule. Removing
# output.schema fixed it immediately — same behavior animate.yaml already
# relies on (also no output.schema, also reliably calls validate_spec
# several times). Not revisiting this here — script.yaml (Anthropic) is
# the file where a stronger model would make the A/B worth doing.

limits:
  max_turns: 25     # room for several validate_spec correction rounds —
                     # qwen3 typically needs more than a stronger model
                     # would, and even Gemini has needed more than one
                     # round on some topics
  max_tokens: 6144   # qwen3's thinking trace alone can run past 2500
                      # tokens before it even starts the real answer
