# STATUS: local-default rung. Same job as publish.anthropic.yaml (spec ->
# checked, fully rendered, uploaded video) minus Layer 2 vision QA
# (sample_frames) — see qa.yaml's comment for why: qwen3:8b has no vision,
# and check_render.ts's caption-overlaps-structure check
# (remotion/primitives/textBox.ts) now covers the one class of problem
# Layer 2's instructions existed for, mechanically if approximately.
#
# Deliberately gates ONLY youtube.upload, same rationale as
# publish.anthropic.yaml's own STATUS comment: check_render/validate_spec/
# render_final are all local, reversible, and auto-approved; only the
# external, hard-to-reverse upload needs a decision. youtube.upload is
# still a STUB (algoreel-mcp/src/youtube-server.ts) — see that file and
# PLAN.md §11.
#
# think: false is load-bearing, not cosmetic — see qa.yaml's STATUS
# comment for the full measured writeup (same root cause found here:
# qwen3:8b sometimes narrates its whole plan into the thinking channel and
# then emits neither a tool call nor any content, a clean done_reason
# "stop" that raising max_tokens can't fix). Also verified directly
# against this agent's own longer prompt and extra youtube.upload tool.
#
# Its own check_render/validate_spec/render_final steps are copied
# verbatim from publish.anthropic.yaml (which documents copying them from
# qa.anthropic.yaml in turn) — same "no config-include mechanism" reason.
# Keep the two in sync by hand if either changes.
name: publish

model:
  provider: ollama
  name: qwen3:8b
  num_ctx: 24576
  temperature: 0.3
  think: false

instructions: |
  You are given a StorySpec JSON. Your job is to make sure it will render
  into a watchable video, render the real publishable version, and
  upload it.

  1. Call check_render on the spec exactly as given.
  2. If it reports any failures, read each message carefully — it names
     the concrete problem and the fix (e.g. "array has 40 elements =
     5658px wide ... use at most 7 elements"). Edit the spec accordingly:
     shrink an oversized array or graph, rebalance or shorten narration
     beats so animation steps get real screen time, or adjust
     targetDurationSec to match what the spec actually produces. Never
     invent what the algorithm does or how long a real render takes —
     those are exactly what check_render is telling you.
  3. Call check_render again on the fixed spec. Repeat steps 2-3 until it
     reports pass: true. A warning-only result (no errors) already counts
     as pass: true — you don't need to chase warnings to zero.
  4. Call validate_spec to confirm the fixed spec is still structurally
     and semantically valid — check_render only catches layout/pacing
     problems, not the shape and consistency checks validate_spec already
     owns.
  5. Once check_render and validate_spec are both clean, call render_final
     with the final spec — this is the real, full-quality render, not the
     fast preview.
  6. Call youtube.upload with: videoPath from render_final's result;
     title, description, and tags taken directly from the spec's
     youtube.title/description/tags fields, unchanged; visibility
     "unlisted" unless the user's original message explicitly asked for
     a different visibility. Never default to "public" on an unattended
     run.
  7. Report back: the videoId and url youtube.upload returned, its note
     field verbatim (it will say this was a stub — never imply a real
     video went live), durationSec and sizeBytes from render_final, and a
     short list of what you changed from the original spec and why (skip
     this if nothing needed changing).

mcp:
  - name: algoreel
    transport: stdio
    # ${ALGOREEL_MCP_DIR} keeps this config machine-independent — export it
    # to algoreel-mcp's path before running:
    #   export ALGOREEL_MCP_DIR=/path/to/AlgoReel/algoreel-mcp
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/server.ts"]
  - name: youtube
    transport: stdio
    # A deliberately separate server from algoreel's — see
    # publish.anthropic.yaml's STATUS comment and youtube-server.ts itself.
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/youtube-server.ts"]

tools:
  - "algoreel.check_render"
  - "algoreel.validate_spec"
  - "algoreel.render_final"
  - "youtube.upload"

approvals:
  mode: annotated
  auto_approve: ["algoreel.check_render", "algoreel.validate_spec", "algoreel.render_final"]
  require: ["youtube.upload"]
  timeout: 30m
  on_timeout: deny

limits:
  max_turns: 20      # a handful of check_render/fix rounds, one
                      # validate_spec, one render_final, one
                      # youtube.upload call — generous headroom since a
                      # local model may need more than the minimum
  max_tokens: 4096
