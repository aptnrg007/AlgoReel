# STATUS: running on Anthropic's claude-sonnet-5 by default, via
# AgentForge's anthropic provider. Verified live: 3/3 clean runs (two
# indirect topics, one direct), each completing in exactly 3 tool calls —
# list_algorithms -> run_algorithm -> validate_spec, valid on the very
# first attempt, no retry loop needed. Needed one AgentForge fix first:
# MCP tool names are namespaced "<server>.<tool>" (dots), which
# Anthropic's tool-name schema rejects outright with a 400; the openai
# provider already translated dots for its own wire format
# (toWireToolName/fromWireToolName in internal/provider/openai.go), but
# anthropic.go had no equivalent, so it sent Anthropic a name guaranteed
# to be rejected. Fixed by applying that same translation to
# anthropic.go's four tool-name call sites. Also: claude-sonnet-5 rejects
# a `temperature` field outright (confirmed via a live 400), which is why
# there isn't one below.
#
# Since then: a topic that doesn't match any of the 3 hand-written
# algorithms (algoreel-mcp/src/algorithms/{binarySearch,bubbleSort,bfs}.ts)
# no longer forces one of them into the slot with misleading narration
# (found live: "reversing a linked list" produced a bubbleSort spec
# describing swaps as "pointer flipping," which is not how reversal
# works). First fix put codegen inline here — this agent wrote the
# TracedArray implementation itself, which worked but bloated this
# prompt with ~40 lines of contract documentation unrelated to
# storytelling. Moved out to a dedicated specialist: ensure_algorithm
# (algoreel-mcp/src/algorithms/ensureAlgorithm.ts) hands the actual
# writing to a separate, toolless agent (algorithm.yaml) running on a
# free local model, retrying up to 3 times with sandbox.ts's real
# validator errors fed back on failure. This agent now only needs to ask
# for an algorithm by name — no TracedArray contract, no code, no
# sandbox awareness. Linked-list reversal, binary tree in-order traversal,
# and a stack-based balanced-parentheses check are now genuinely
# supported too (reverseLinkedList/inorderTraversal/checkBalancedParens,
# all hand-written — one generic StructureView primitive renders every
# node/link structure via a declared layout: row/column/levels/circle,
# see remotion/primitives/layout.ts) — no fake "array standing in for a
# tree" possible, since every one of these renders as real connected
# nodes, not blocks. Other tree/graph/stack operations beyond these three
# specific algorithms still aren't supported — the instructions below
# tell the agent to be honest about whatever's still missing rather than
# force a mismatch, same principle as before.
#
# A free/local-only alternative lives side by side in script.free.yaml —
# same instructions and tools, only the model block differs. It runs on
# Google AI Studio's free-tier Gemini (via AgentForge's native `gemini`
# provider, added for this project — see PLAN.md §8) or fully local
# qwen3 via Ollama, at the cost of real drawbacks documented in that
# file's STATUS comment and in README.md's Phase 3 section: Gemini's
# 20-requests/day cap on the non-lite model, and qwen3's multi-round
# self-correction ceiling (only 1 of 5 direct-topic trials succeeded even
# with the run_algorithm step below added — the rest silently gave no
# final answer). Use this file unless you specifically need to avoid a
# paid API key.
name: script

model:
  provider: anthropic
  name: claude-sonnet-5
  api_key: ${ANTHROPIC_API_KEY}
  # No temperature field — claude-sonnet-5 rejects it as a request
  # parameter ("`temperature` is deprecated for this model").
  #
  # Alternatives, same config shape — switch by commenting/uncommenting,
  # or just run script.free.yaml instead, which already has these wired
  # up along with their tradeoffs (see that file and README.md):
  # provider: gemini
  # name: gemini-flash-lite-latest
  # api_key: ${GOOGLE_API_KEY}
  #
  # provider: openai
  # base_url: https://api.x.ai/v1
  # name: <xAI model id>
  # api_key: ${XAI_API_KEY}
  #
  # provider: ollama
  # name: algoreel-llama

instructions: |
  HARD RULE, before anything else: you may NEVER give a final text answer
  in this conversation until a validate_spec tool call has returned
  valid: true. Not on your first turn, not "because you're confident it's
  already correct" — always call validate_spec on your draft and see
  valid: true with your own eyes first. A JSON document that merely
  matches the schema but skipped validate_spec is a failed attempt, even
  if every field looks right. This matters because validate_spec catches
  real mistakes a schema cannot see: it actually runs the algorithm, so it
  knows exactly how many animation steps exist and whether your narration
  or emphasis words match what really happens — you do not, until you ask it.

  You turn a topic into a complete StorySpec for a DSA explainer Short.
  You decide the story: which algorithm best fits the topic, a concrete
  input, the hook, the narration beats, which words get emphasis, and the
  YouTube metadata. You never invent what the algorithm actually does —
  validate_spec is the only source of truth for that.

  Required steps, in order:
  1. Call list_algorithms.
  2. If one of its entries genuinely matches the topic, pick it and a
     small, concrete input (5-8 numbers is plenty; binarySearch needs it
     sorted ascending; bfs needs nodes/edges/start).

     If nothing genuinely matches but the topic is really about *sorting*
     a list of numbers (merge sort, quicksort, insertion sort, selection
     sort, or anything else sort-shaped that isn't listed yet), call
     ensure_algorithm with {algorithm, structure: "array"} instead of
     forcing a mismatched existing algorithm into the slot. It makes sure
     a working implementation exists — writing and validating one behind
     the scenes if it doesn't yet — and can take a while the first time
     (tens of seconds to a few minutes), but is near-instant on every
     later request for the same name. It does not run the algorithm on
     your chosen input; use the name it returns with
     run_algorithm({algorithm: <that name>, input}) for that, same as any
     other algorithm.

     ensure_algorithm is sorting-only, not searching — its correctness
     check works by comparing the result against the array sorted
     ascending, which has no meaning for a search. binarySearch is the
     only searching algorithm available (from list_algorithms); a
     different search (linear search, two-pointer search, ...) is not
     currently supported by ensure_algorithm and should be treated the
     same as a non-array topic below (found live: repeatedly asking
     ensure_algorithm for "linear search" burns real attempts and always
     fails, because a correct linear search never produces a sorted
     array — don't call ensure_algorithm for anything that doesn't
     actually sort).

     If the topic isn't even array-shaped — a genuinely different data
     structure — check list_algorithms for a real match on that structure
     first. Three real ones exist now, each rendered as actual connected
     nodes (StructureView), never blocks: reverseLinkedList (real singly-
     linked-list nodes, real next-pointer rewiring), inorderTraversal
     (a real binary tree, rendered by depth, real left/right links),
     checkBalancedParens (a real stack, pushes and pops actually adding
     and removing nodes from view). If nothing there genuinely matches —
     trees or graphs beyond those two specific algorithms, any other
     linked-list or stack operation (insertion, cycle detection, general
     expression evaluation) — do not force-fit an existing algorithm, and
     do not write a new "array-shaped" stand-in and then narrate it as if
     it were the original request. Both are the same mistake: the video
     ends up teaching a mechanism that isn't how the real thing works. Two
     real examples this has produced: describing bubble sort's swaps as
     linked-list pointer changes, and — even with a correctly implemented,
     honestly-named new algorithm — describing a two-pointer array
     reversal's value swaps as "how a linked list reversal works," when
     real linked-list reversal rewires next-pointers in a single pass and
     never compares or swaps values at all. This is exactly the mistake
     these three algorithms now exist to make unnecessary for their
     specific topics — use one instead of reaching for either workaround.
     Whatever you actually run, name the spec after *that*: topic, hook,
     title, and every narration beat must describe the real algorithm
     and its real mechanism (swap-based array reversal, bubble sort,
     whichever it genuinely is) — never the original request's data
     structure or operation if what you built doesn't actually match it.
     A viewer should never come away believing something untrue about
     the topic they asked for.
  3. Call run_algorithm({algorithm, input}) with the name you picked in
     step 2 (or the name ensure_algorithm returned) and read its summary
     and primaryStepCount. Base every "op:N" beat you write on
     what it actually reports, not on what you'd expect the algorithm to
     do — it is the only source of truth for the trace, and its
     primaryStepCount is a hard ceiling on how many "op:N" beats you may
     write (fewer is fine; never more).
  4. Draft a full StorySpec matching this exact top-level shape — copy this
     structure, don't nest fields anywhere other than shown here (a common
     mistake is nesting targetDurationSec inside youtube; it belongs at the
     top level, as a sibling of youtube, not inside it):
     {
       "version": 1,
       "topic": "...",
       "targetDurationSec": 30,
       "hook": "...",
       "narration": [{ "beat": "intro", "text": "..." }, ...],
       "emphasis": ["...", "..."],
       "complexity": { "time": "...", "space": "..." },
       "youtube": { "title": "...", "description": "...", "tags": ["..."] },
       "algorithm": "...",
       "input": { ... }
     }
     Two rules the schema itself cannot enforce:
     - "op:N" beats MUST start at op:0 and increase one at a time with no
       gaps: op:0, op:1, op:2, ... — never op:1, op:2 (missing op:0) and
       never op:0, op:2 (skipping op:1). Use at most run_algorithm's
       primaryStepCount; when in doubt, write fewer beats.
     - Every string in "emphasis" must appear character-for-character
       (case-insensitive) inside your narration text somewhere — prefer
       single words you're certain you used, over invented phrases.
  5. Call validate_spec on that draft — even a rough one, immediately,
     as your very next tool call after drafting it. Do not skip this.
  6. Read the errors. Fix every one, including ones a JSON Schema can't
     express: an unsorted array, more "op:N" beats than the algorithm has
     real animation steps (use at most the primaryStepCount run_algorithm
     and validate_spec name), an emphasis word that isn't literally in any
     narration text.
  7. Call validate_spec again on the fixed version. Repeat step 6-7 until
     it returns valid: true.
  8. Only then, give your final answer: the StorySpec JSON and nothing
     else — no prose, no markdown fences, no explanation.

mcp:
  - name: algoreel
    transport: stdio
    # ${ALGOREEL_MCP_DIR} keeps this config machine-independent — export it
    # to algoreel-mcp's path before running:
    #   export ALGOREEL_MCP_DIR=/path/to/AlgoReel/algoreel-mcp
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/server.ts"]

tools:
  - "algoreel.list_algorithms"
  - "algoreel.run_algorithm"
  - "algoreel.ensure_algorithm"
  - "algoreel.validate_spec"

approvals:
  mode: annotated
  auto_approve:
    ["algoreel.list_algorithms", "algoreel.run_algorithm", "algoreel.ensure_algorithm", "algoreel.validate_spec"]
  # list_algorithms and validate_spec are pure and side-effect-free.
  # run_algorithm does write a scratch operations-log JSON under
  # algoreel-mcp/out/ (src/server.ts) so the model can be given a
  # primaryStepCount without dumping the full trace into context, but
  # that file is disposable working data, not a published artifact like
  # animate.yaml's render_preview output — so auto-approving it here
  # doesn't skip anything a human would want to gate.
  # ensure_algorithm is more consequential than the other three — on a
  # cache miss it writes a permanent source file into
  # algoreel-mcp/src/algorithms/generated/ — but it's still auto-approved
  # here: the write only ever happens after sandbox.ts's own validators
  # pass (result correctness, comparison instrumentation, complexity
  # class), it costs nothing (runs on a free local model, not a paid
  # API), and it's trivially reversible (delete the file, rebuild the
  # manifest). That's a different risk profile from render_preview/
  # render_final or youtube.upload, which qa.yaml/publish.yaml gate on
  # purpose.

# Deliberately NOT using AgentForge's output.schema feature here, even
# though it exists for exactly this job (auto-validate + auto-retry a
# final JSON answer against a schema — see algoreel-mcp/scripts/
# generate-story-spec-schema.ts, which still generates the schema file at
# ./schemas/story-spec.json). Measured directly against qwen3: with
# output.schema present, it reliably skipped calling validate_spec and
# jumped straight to a final answer every time (3 different instruction
# phrasings, always the same result) — almost certainly because
# AgentForge auto-appends "Your final response must be a single JSON
# document conforming exactly to the following JSON Schema"
# (internal/schema/extract.go) as the very last thing in the system
# prompt, after these instructions, and a small model weights that
# recency over an earlier "call validate_spec first" rule. Removing
# output.schema fixed it immediately — same behavior animate.yaml already
# relies on (also no output.schema, also reliably calls validate_spec
# several times). Worth an A/B now that Claude Sonnet 5 is the default
# model — restore this and re-run; keep it only if validate_spec
# discipline survives (and it would also finally strip the stray
# ```json fences Claude wraps its answer in despite step 8 above):
# output:
#   schema: ./schemas/story-spec.json
#   on_invalid: retry
#   max_retries: 3

limits:
  max_turns: 25     # generous headroom for several validate_spec
                     # correction rounds — Claude Sonnet 5 has only ever
                     # needed 3 tool calls in testing, but this leaves
                     # room for a harder topic or script.free.yaml's
                     # weaker models
  max_tokens: 6144   # generous headroom for a "thinking" model's trace
                      # (can run past 2500 tokens before the real answer
                      # starts). Back down from 8192 now that this agent
                      # no longer writes algorithm code itself — that
                      # room moved to algorithm.yaml, which does.
