# STATUS: local-default rung. Same job as qa.anthropic.yaml (spec ->
# checked, rendered preview mp4) minus Layer 2 vision QA (sample_frames):
# qwen3:8b has no vision, so this agent only ever gets check_render/
# validate_spec/render_preview — three mechanical tool calls this
# project's local-model testing already found reliable (animate.yaml runs
# the same kind of tool-calling shape — list_algorithms -> run_algorithm
# -> validate_spec [retries] -> render_preview — on the same model). The
# creative, open-ended authoring that actually broke qwen3 (script.yaml's
# job, 1 success in 5 per script.free.yaml's STATUS comment) never
# happens here: this agent edits a spec against structured error
# messages, it doesn't write one from scratch.
#
# check_render's coverage is stronger than it used to be specifically
# because Layer 2 is missing here: src/spec/checkRender.ts now includes
# a caption-overlaps-structure check (remotion/primitives/textBox.ts)
# that catches the one class of problem Layer 2's "is any text cut off,
# does anything overlap" instruction existed for, mechanically —
# estimated, not measured, so it's a warning, not an error (see that
# file's comment), but it's real signal a purely local pipeline wouldn't
# otherwise have at all.
#
# Use qa.anthropic.yaml instead of this file for the extra sample_frames
# pass over what check_render already estimates — real pixels, not an
# estimate, at the cost of a paid API call per QA round.
#
# think: false is load-bearing, not cosmetic. Measured live (raw
# /api/chat, AGENTFORGE_DEBUG_RAW): with thinking on and tools registered,
# qwen3:8b sometimes narrates its entire plan ("call check_render, then
# validate_spec, then...") into the thinking channel and then emits
# neither a tool call nor any content — Ollama reports this as a clean
# done_reason "stop" with eval_count well under max_tokens, so it is not a
# truncation and raising max_tokens does not fix it. Roughly half of a
# small sample of runs against this exact agent+prompt hit it before this
# was set. think: false removes the channel the failure happens in; every
# run in a follow-up sample completed normally. run.sh/preview.sh's
# run_agent_retrying_empty bash-level retry is kept as a second line of
# defense, not the primary fix.
name: qa

model:
  provider: ollama
  name: qwen3:8b
  num_ctx: 24576
  temperature: 0.3
  think: false

instructions: |
  You are given a StorySpec JSON. Your job is to make sure it will render
  into a watchable video, then render it.

  1. Call check_render on the spec exactly as given.
  2. If it reports any failures, read each message carefully — it names
     the concrete problem and the fix (e.g. "array has 40 elements =
     5658px wide ... use at most 7 elements"). Edit the spec accordingly:
     shrink an oversized array or graph, rebalance or shorten narration
     beats so animation steps get real screen time, or adjust
     targetDurationSec to match what the spec actually produces. Never
     invent what the algorithm does or how long a real render takes —
     those are exactly what check_render is telling you.
  3. Call check_render again on the fixed spec. Repeat steps 2-3 until it
     reports pass: true. A warning-only result (no errors) already counts
     as pass: true — you don't need to chase warnings to zero.
  4. Call validate_spec to confirm the fixed spec is still structurally
     and semantically valid — check_render only catches layout/pacing
     problems, not the shape and consistency checks validate_spec already
     owns.
  5. Once check_render and validate_spec are both clean, call
     render_preview with the final spec.
  6. Report back: the videoPath and durationSec render_preview returned,
     and a short list of what you changed from the original spec and why
     (skip this list if the original spec needed no changes at all).

mcp:
  - name: algoreel
    transport: stdio
    # ${ALGOREEL_MCP_DIR} keeps this config machine-independent — export it
    # to algoreel-mcp's path before running:
    #   export ALGOREEL_MCP_DIR=/path/to/AlgoReel/algoreel-mcp
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/server.ts"]

tools:
  - "algoreel.check_render"
  - "algoreel.validate_spec"
  - "algoreel.render_preview"

approvals:
  mode: annotated
  auto_approve: ["algoreel.check_render", "algoreel.validate_spec"]
  # check_render and validate_spec are pure and side-effect-free.
  # render_preview is deliberately NOT auto-approved: it's the expensive,
  # artifact-producing step (an actual render to disk), same gating
  # principle as animate.yaml.

limits:
  max_turns: 20      # a handful of check_render/fix rounds plus one
                      # validate_spec and one render_preview call —
                      # generous headroom since a local model may need
                      # more than the minimum
  max_tokens: 4096
