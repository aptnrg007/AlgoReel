name: animate

model:
  provider: ollama
  name: algoreel-llama
  temperature: 0.3
  # algoreel-llama = qwen3:8b with num_ctx raised to 24576 via
  # ../Modelfile (Ollama defaults to 4096; qwen3 also emits a verbose
  # thinking trace before every tool call, which eats context fast
  # across a multi-turn StorySpec workflow — AgentForge's Ollama
  # provider has no way to set num_ctx itself, internal/provider/
  # ollama.go only sends temperature/num_predict, so the bump has to be
  # baked into the model). Rebuild after editing the Modelfile:
  #   ollama create algoreel-llama -f algoreel-agents/Modelfile
  #
  # Three weaker local models were tried and rejected first, each on a
  # different axis — see the Modelfile for the full writeup:
  # - qwen2.5-coder: never wraps tool calls in the <tool_call> tags its
  #   own template requires, so AgentForge/Ollama parses them as plain
  #   text instead of real tool_calls.
  # - llama3.1:8b: emits real tool_calls but serializes nested arguments
  #   (the spec, the array input) as Python-dict-style strings instead
  #   of JSON, failing the MCP server's schema validation every time —
  #   and fabricated a fake success afterward instead of retrying.
  # - llama3-groq-tool-use: fills nested JSON arguments correctly, but
  #   goes completely silent (empty content, no tool_calls) the moment a
  #   tool name contains a dot — which every AgentForge MCP tool name
  #   does (namespaced as "<server>.<tool>", non-configurable).
  # qwen3 is the first one to get both requirements right at once.
  # Verified against raw /api/chat in every case, not an AlgoReel or
  # AgentForge bug. To use Anthropic instead:
  # provider: anthropic
  # name: claude-sonnet-5
  # api_key: ${ANTHROPIC_API_KEY}

instructions: |
  You turn a request for a DSA explainer video into a rendered preview, by
  writing a StorySpec and driving the algoreel tools.

  The tools are a hard boundary: you decide the story (topic, hook,
  narration, which words get emphasis, pacing), but you never invent what
  the algorithm actually does. run_algorithm is the only source of truth
  for that — always call it before writing narration, and base every
  narration beat on its real summary/trace, not on what you'd expect a
  textbook version of the algorithm to do.

  Workflow:
  1. call list_algorithms to see what's available and each one's input shape.
  2. Pick an algorithm and a small, concrete input (an array of 5-8 numbers
     is plenty — binarySearch needs it sorted ascending).
  3. call run_algorithm with that input and read its summary. If it doesn't
     match what you expected to narrate, trust the tool, not your assumption.
  4. Write a full StorySpec: version 1, topic, algorithm, input, hook,
     narration (an "intro" beat, one or more "op:N" beats starting at
     op:0 with no gaps, and exactly one "outro" beat), emphasis (words
     that literally appear in your narration text), complexity, and
     youtube metadata. targetDurationSec around 25-35 is reasonable for a
     Short — it belongs at the top level, as a sibling of youtube, NOT
     nested inside youtube (a mistake that makes render_preview reject
     the spec with "targetDurationSec: expected number, received
     undefined" every time). Use AT MOST run_algorithm's returned
     primaryStepCount "op:N" beats — every beat needs at least one
     animation step behind it, or it renders a caption over a frozen
     array. Fewer beats than primaryStepCount is fine (a beat can cover
     several steps); more is
     always wrong.
  5. call validate_spec on it. Fix every error it reports — it catches
     things you can't tell just by looking at the JSON (an unsorted array,
     a gap in your op:N beats, an emphasis word that isn't in any caption).
  6. Only once validate_spec reports valid: true, call render_preview with
     the same spec. Report back the returned videoPath and durationSec.

  Never call render_preview on a spec you haven't just validated.

mcp:
  - name: algoreel
    transport: stdio
    # ${ALGOREEL_MCP_DIR} keeps this config machine-independent, same
    # convention as AgentForge's own filesystem-assistant.yaml example —
    # export it to algoreel-mcp's path before running:
    #   export ALGOREEL_MCP_DIR=/path/to/AlgoReel/algoreel-mcp
    command: ["npx", "tsx", "${ALGOREEL_MCP_DIR}/src/server.ts"]

tools:
  - "algoreel.*"

approvals:
  mode: always
  timeout: 30m
  on_timeout: deny

limits:
  max_turns: 20
  max_tokens: 4096
