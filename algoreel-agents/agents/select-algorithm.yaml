# STATUS: local rung of ensureSpec.ts's algorithm-selection step
# (algoreel-mcp/src/spec/ensureSpec.ts) — script.yaml's replacement.
# script.yaml used to hold this decision inside a multi-round
# validate_spec self-correction loop on the same tool-using agent that
# also authored narration; ensureSpec.ts pulls it out into its own
# single-shot, toolless call, only invoked when a deterministic keyword
# match against the real registry (ensureSpec.ts's keywordMatchAlgorithm)
# didn't already answer it — a direct topic like "explain bubble sort"
# never reaches this file at all.
#
# Deliberately toolless, no mcp:/tools:/approvals: — same two reasons
# algorithm.yaml already documents for its own toolless design: (1) this
# is a single "read prompt, pick a name" completion, not a conversation,
# which is what this project's local-model testing already found a small
# model can do reliably (unlike multi-round tool-call self-correction,
# which the old, now-deleted script.free.yaml measured at a best-case 1
# success in 5 direct-topic trials); (2) giving it algoreel's MCP
# server would spawn a second server process for no reason, since
# ensureSpec.ts already calls run_algorithm/ensure_algorithm directly as
# TypeScript, not through this agent.
#
# output.schema is safe here specifically because this agent is
# toolless: AgentForge's Ollama provider only sends `format` (real
# grammar-constrained decoding, not just prompt-and-hope) when no tools
# are registered on the request (internal/provider/ollama.go's
# ollamaFormat) — the old, now-deleted script.yaml found output.schema
# broke tool-call discipline on qwen3 when combined with real tools, but
# that failure mode doesn't exist for an agent with no tools to skip.
# Verified live against
# qwen3:8b with algorithm-choice.json before wiring this up: 100% valid
# shape, correct pick on an indirect topic with no algorithm named in the
# prompt ("find something in an already-alphabetized phone book" ->
# binarySearch).
#
# algorithm-choice.json deliberately has no `input` field — confirmed
# live that an open-shaped object field breaks under Ollama's JSON-Schema-
# to-GBNF grammar conversion (a nested {array:[1,2,3]} came back as
# {array: {type:"integer", values:[1,2,3]}}, garbage). ensureSpec.ts picks
# input deterministically instead — see its own comment.
name: select-algorithm

model:
  provider: ollama
  name: qwen3:8b
  num_ctx: 24576
  temperature: 0.2

instructions: |
  You pick which known algorithm best fits a video topic, or name a new
  one to be generated if nothing fits. Answer only the JSON object the
  schema requires — no prose, no markdown fences.

output:
  schema: ./schemas/algorithm-choice.json
  on_invalid: retry
  max_retries: 2

limits:
  max_turns: 1
  max_tokens: 512
